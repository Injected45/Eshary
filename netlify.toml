# Netlify builds the WEB version (iPhone and browsers) from this GitHub
# repository. Only the `web` branch is built and published; after every
# change the working branch is pushed to `web` too (the owner's rule since
# 2026-11-25), so the link is always the latest app. Netlify → Deploys →
# Trigger deploy rebuilds the last one.
[build]
  command = "bash netlify-build.sh"
  publish = "build/web"
  # exit 0 = no build: any other branch or pull request, and a push that
  # changes nothing the page is built from (docs, migrations, tests, the
  # admin platform) — the free plan's build minutes are kept for real
  # changes. The same commit again (Trigger deploy) and an unknown older
  # commit always build.
  ignore = "test \"$BRANCH\" != \"web\" || { test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- lib web assets pubspec.yaml pubspec.lock netlify.toml netlify-build.sh; }"

[build.environment]
  # the same Flutter as on the developer's PC
  FLUTTER_VERSION = "3.41.9"
  SUPABASE_URL = "https://ashpubvnedhkgamnipky.supabase.co"
  # public by design: it is in every APK and in the page itself
  SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaHB1YnZuZWRoa2dhbW5pcGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzc2MTEsImV4cCI6MjA5MjcxMzYxMX0.aglafY83JjAfHk4SBBv9eAnWKnhe8AO11YX28TjVExw"
